  <text x="300" y="330" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#1E40AF">Supporting entrepreneurs since 2015</text>
  
  <text x="300" y="60" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="bold" fill="#1E40AF">Our Expert Team</text>
