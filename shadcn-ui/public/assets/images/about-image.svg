<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="#F0F9FF"/>
  
  <!-- Team illustration -->
  <circle cx="150" cy="150" r="50" fill="#DBEAFE"/>
  <circle cx="150" cy="125" r="25" fill="#3B82F6"/>
  <rect x="125" y="160" width="50" height="70" rx="10" fill="#3B82F6"/>
  
  <circle cx="250" cy="150" r="50" fill="#DBEAFE"/>
  <circle cx="250" cy="125" r="25" fill="#1E40AF"/>
  <rect x="225" y="160" width="50" height="70" rx="10" fill="#1E40AF"/>
  
  <circle cx="350" cy="150" r="50" fill="#DBEAFE"/>
  <circle cx="350" cy="125" r="25" fill="#3B82F6"/>
  <rect x="325" y="160" width="50" height="70" rx="10" fill="#3B82F6"/>
  
