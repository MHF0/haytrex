<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="#F0F9FF"/>
  
  <!-- Business meeting illustration -->
  <rect x="100" y="150" width="400" height="200" rx="10" fill="#DBEAFE"/>
  
  <!-- Table -->
  <rect x="150" y="250" width="300" height="20" rx="5" fill="#3B82F6"/>
  <rect x="160" y="270" width="10" height="50" fill="#1E40AF"/>
  <rect x="430" y="270" width="10" height="50" fill="#1E40AF"/>
  
  <!-- Business person 1 -->
  <circle cx="200" cy="200" r="25" fill="#3B82F6"/>
  <rect x="185" y="225" width="30" height="40" rx="5" fill="#3B82F6"/>
  
  <!-- Business person 2 -->
  <circle cx="300" cy="200" r="25" fill="#1E40AF"/>
  <rect x="285" y="225" width="30" height="40" rx="5" fill="#1E40AF"/>
  
  <!-- Business person 3 -->
  <circle cx="400" cy="200" r="25" fill="#3B82F6"/>
  <rect x="385" y="225" width="30" height="40" rx="5" fill="#3B82F6"/>
  
  <!-- Calendar and document icons -->
  <rect x="100" y="50" width="80" height="80" rx="5" fill="#3B82F6"/>
  <rect x="110" y="60" width="60" height="15" fill="white"/>
  <rect x="110" y="80" width="15" height="15" fill="white"/>
  <rect x="132.5" y="80" width="15" height="15" fill="white"/>
  <rect x="155" y="80" width="15" height="15" fill="white"/>
  <rect x="110" y="102.5" width="15" height="15" fill="white"/>
  <rect x="132.5" y="102.5" width="15" height="15" fill="white"/>
  <rect x="155" y="102.5" width="15" height="15" fill="white"/>
  
  <rect x="420" y="50" width="80" height="80" rx="5" fill="#1E40AF"/>
  <rect x="430" y="60" width="60" height="10" fill="white"/>
  <rect x="430" y="75" width="60" height="5" fill="white"/>
  <rect x="430" y="85" width="60" height="5" fill="white"/>
  <rect x="430" y="95" width="40" height="5" fill="white"/>
  <rect x="430" y="105" width="60" height="5" fill="white"/>
  <rect x="430" y="115" width="50" height="5" fill="white"/>
  
  <text x="300" y="360" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="bold" fill="#1E40AF">Schedule Your Business Consultation</text>
</svg>