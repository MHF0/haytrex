# /etc/nginx/sites-available/mmsvcs.conf
# Certbot adds the HTTPS (443) block and the http->https redirect to this file.
server {
    listen 80;
    listen [::]:80;
    server_name mmsvcs.com www.mmsvcs.com;

    # Resumes are capped at 5 MB by the app; leave headroom for the form fields.
    client_max_body_size 6m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
