  <path d="M120 250 q0 -80 80 -80 q80 0 80 80 z" fill="#10151C"/>
  <path d="M118 250 h164 q14 0 14 12 q0 10 -14 10 h-164 q-14 0 -14 -10 q0 -12 14 -12 z" fill="#F58A1F"/>
  <circle cx="200" cy="210" r="17" fill="#F58A1F"/>
  <path d="M193 210 a7 7 0 1 1 14 0 a7 7 0 1 1 -14 0 M200 199 l3 5 h-6 z M200 221 l3 -5 h-6 z M189 210 l5 -3 v6 z M211 210 l-5 -3 v6 z" fill="#10151C"/>
