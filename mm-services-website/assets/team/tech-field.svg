  <rect x="0" y="464" width="400" height="36" fill="#10151C" opacity="0.85"/>
  <text x="200" y="488" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" letter-spacing="2" fill="#E9EDF2">PLACEHOLDER — ADD YOUR TEAM PHOTO</text>
